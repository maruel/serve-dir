on: [push, pull_request]
name: Run tests
jobs:
  # Keep OS coverage for platform-sensitive runtime behavior.
  check:
    name: "check: go${{matrix.gover}}.x/${{matrix.os}}"
    runs-on: "${{matrix.os}}"

    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Do not forget to bump every 6 months!
        gover: ["1.21"]
    env:
      CGO_ENABLED: 0
      PYTHONDONTWRITEBYTECODE: x
    steps:
    - name: Turn off git core.autocrlf
      if: matrix.os == 'windows-latest'
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - uses: actions/setup-go@v7
      with:
        go-version: "~${{matrix.gover}}.0"
    - name: 'Check: go test -cover'
      if: always()
      run: make test
      # Don't send code coverage if anything failed to reduce spam.
    - uses: codecov/codecov-action@v7
    - name: 'Cleanup'
      if: always()
      run: rm coverage.txt
    - name: 'Check: go test -race'
      run: make test-race
      env:
        CGO_ENABLED: 1
    - name: 'Install'
      if: always()
      run: go install .
    - name: "Check: go generate doesn't modify files"
      if: always()
      run: |
        go generate ./...
        # Also test for untracked files. go generate should not generate ignored
        # files either.
        TOUCHED=$(git status --porcelain --ignored -- . \
          ':(exclude).venv' ':(exclude).ruff_cache' \
          ':(top,exclude,literal)coverage.txt' ':(top,exclude,literal)codecov' \
          ':(top,exclude,literal)codecov.SHA256SUM' ':(top,exclude,literal)codecov.SHA256SUM.sig' \
          ':(top,exclude,literal)codecov.exe' ':(top,exclude,literal)codecov.exe.SHA256SUM' \
          ':(top,exclude,literal)codecov.exe.SHA256SUM.sig')
        if ! test -z "$TOUCHED"; then
          echo "go generate created these files, please fix:"
          echo "$TOUCHED"
          false
        fi
    - name: "Check: go mod tidy doesn't modify files"
      if: always()
      run: |
        go mod tidy
        TOUCHED=$(git status --porcelain --ignored -- . \
          ':(exclude).venv' ':(exclude).ruff_cache' \
          ':(top,exclude,literal)coverage.txt' ':(top,exclude,literal)codecov' \
          ':(top,exclude,literal)codecov.SHA256SUM' ':(top,exclude,literal)codecov.SHA256SUM.sig' \
          ':(top,exclude,literal)codecov.exe' ':(top,exclude,literal)codecov.exe.SHA256SUM' \
          ':(top,exclude,literal)codecov.exe.SHA256SUM.sig')
        if ! test -z "$TOUCHED"; then
          echo "go mod tidy was not clean, please update:"
          git diff
          false
        fi
    - name: Set up static-check Go toolchain
      if: always()
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
    - name: Static checks
      if: always()
      env:
        CGO_ENABLED: 1
      run: make verify

  codeql:
    name: "codeql: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
